services:
  postgres:
    image: postgres:17
    container_name: assertive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assertive
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

