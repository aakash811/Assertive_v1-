name: Assertive

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install

      - run: pnpm playwright test
        env:
          ASSERTIVE_API_KEY: ${{ secrets.ASSERTIVE_API_KEY }}
